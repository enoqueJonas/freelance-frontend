name: ConecTA RF13-RF14 Integration QA

on:
  push:
    branches:
      - feat/conecta-rf13-rf14-agreement-versions
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agreement-versions-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run lint
      - name: Vite production build
        run: npm run build
      - name: All agreement, contextual profile, payment and dispute tests
        run: npm test
